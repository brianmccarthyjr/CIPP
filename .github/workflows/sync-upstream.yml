name: Sync upstream

# Nightly merge of KelvinTegelaar/CIPP into this fork. Merges, never discards.
# If upstream conflicts with our files the job fails and nothing is pushed.
# Push uses SYNC_PAT so the Azure SWA deploy workflow fires on it.

on:
  schedule:
    - cron: '7 6 * * *' # 2:07 AM Eastern (EDT); 1:07 AM in winter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Merge upstream main
        run: |
          git config user.name "brianmccarthyjr"
          git config user.email "30422514+brianmccarthyjr@users.noreply.github.com"
          git remote add upstream https://github.com/KelvinTegelaar/CIPP.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin main
